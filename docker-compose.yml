services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: takps
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: tak_ps_stem
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]

  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on: [postgres]
    ports: ["3000:3000"]

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  pgdata: